<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>Мой стикерпак · Согласование</title>
<link rel="stylesheet" href="./style.css?v=order-page2"><script defer src="./pilot.js?v=open1"></script>
<script defer src="./review.js?v=two-rounds1"></script></head>
<body><header><a class="brand" href="./">azat<span>.</span>life</a><span>Мой стикерпак</span></header>
<main class="review"><h1 id="title">Открываем заказ…</h1><p id="price" class="price"></p>
<div id="order-area"></div>
<p id="activity" role="status"></p>
<div id="order-tools" hidden>
<section id="save-order" class="save-order" hidden>
<a id="save-order-telegram" class="primary" target="_blank" rel="noopener noreferrer">Сохранить ссылку в Telegram ↗</a>
<p>Нажмите «Запустить» в боте, чтобы получить ссылку в чат.</p>
</section>
<button id="copy-link" type="button">Скопировать ссылку на заказ</button>
<p id="copy-status" role="status"></p>
<details id="order-settings">
<summary>Настройки заказа</summary>
<form id="title-form" hidden><label for="pack-title">Название стикерпака</label>
<input id="pack-title" type="text" maxlength="64" placeholder="Например, Азат на связи">
<button type="submit">Сохранить название</button><p role="status" id="title-status"></p></form>
<form id="contact-form" hidden><label for="telegram-contact">Ваш ник в Telegram</label>
<input id="telegram-contact" type="text" placeholder="@username" maxlength="160" autocapitalize="none" autocorrect="off" spellcheck="false" required>
<button type="submit">Сохранить ник</button><p id="contact-status" role="status"></p></form>
</details></div></main></body></html>
